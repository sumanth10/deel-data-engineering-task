[tool.poetry]
name = "acme-spark-jobs"
version = "0.1.0"
description = "CDC streaming pipeline for ACME Delivery Services"
authors = ["Sumant Kulkarni"]

[tool.poetry.dependencies]
python = "^3.11"
pyspark = "3.5.0"
delta-spark = "3.0.0"
pydantic = "^2.6"
pydantic-settings = "^2.2"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0"
pytest-mock = "^3.12"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"